<!--
  ============================================================
  ШАБЛОН: Плавающая кнопка WhatsApp с предзаполненным сообщением
  ============================================================

  КАК ИСПОЛЬЗОВАТЬ:

  Способ 1 (рекомендуемый — на всех страницах, тариф Business):
    Taplink -> Настройки -> Общие -> HTML-код -> вставьте весь код ниже
    Кнопка появится на ВСЕХ страницах вашего Taplink

  Способ 2 (на одной странице, тариф Pro+):
    Taplink -> Добавить блок -> HTML-код -> вставьте весь код ниже
    Кнопка появится только на этой странице

  НАСТРОЙКА:
  1. Замените YOUR_WHATSAPP_NUMBER на ваш номер (формат: 971XXXXXXXXX, без +)
  2. Измените тексты сообщений (русский и английский)
  3. Настройте цвета через CSS-переменные

  ОСОБЕННОСТИ:
  - Плавающая кнопка (fixed position) — всегда видна при прокрутке
  - Анимация пульсации — привлекает внимание
  - Тултип с текстом — появляется при наведении
  - Предзаполненное сообщение — клиенту не нужно думать, что написать
  - Двуязычный (RU/EN) — автоопределение или переключение
  - Адаптивный дизайн — корректно на всех экранах
  - Не блокирует контент — правый нижний угол
  ============================================================
-->

<style>
  /* === CSS Переменные — настройте под себя === */
  .wa-widget {
    --wa-green: #25D366;
    --wa-green-dark: #128C7E;
    --wa-green-hover: #20BD5A;
    --wa-text: #FFFFFF;
    --wa-tooltip-bg: #FFFFFF;
    --wa-tooltip-text: #333333;
    --wa-tooltip-shadow: 0 4px 24px rgba(0, 0, 0, 0.15);
    --wa-size: 60px;
    --wa-bottom: 20px;
    --wa-right: 20px;
    --wa-z-index: 99999;
  }

  /* === Контейнер виджета === */
  .wa-widget {
    position: fixed;
    bottom: var(--wa-bottom);
    right: var(--wa-right);
    z-index: var(--wa-z-index);
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  /* === Тултип (текст над кнопкой) === */
  .wa-tooltip {
    background: var(--wa-tooltip-bg);
    color: var(--wa-tooltip-text);
    padding: 10px 16px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 500;
    line-height: 1.4;
    box-shadow: var(--wa-tooltip-shadow);
    max-width: 220px;
    opacity: 0;
    transform: translateY(10px) scale(0.95);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    pointer-events: none;
    position: relative;
  }

  /* Стрелка тултипа */
  .wa-tooltip::after {
    content: '';
    position: absolute;
    bottom: -6px;
    right: 24px;
    width: 12px;
    height: 12px;
    background: var(--wa-tooltip-bg);
    transform: rotate(45deg);
    box-shadow: 2px 2px 4px rgba(0, 0, 0, 0.05);
  }

  /* Показать тултип при наведении на виджет */
  .wa-widget:hover .wa-tooltip {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }

  /* === Основная кнопка === */
  .wa-button {
    width: var(--wa-size);
    height: var(--wa-size);
    border-radius: 50%;
    background: var(--wa-green);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    text-decoration: none;
    box-shadow: 0 4px 16px rgba(37, 211, 102, 0.4);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
  }

  .wa-button:hover {
    background: var(--wa-green-hover);
    transform: scale(1.08);
    box-shadow: 0 6px 24px rgba(37, 211, 102, 0.5);
  }

  .wa-button:active {
    transform: scale(0.95);
  }

  /* SVG иконка WhatsApp */
  .wa-button svg {
    width: 32px;
    height: 32px;
    fill: var(--wa-text);
  }

  /* === Анимация пульсации === */
  .wa-button::before,
  .wa-button::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    border-radius: 50%;
    border: 2px solid var(--wa-green);
    opacity: 0;
    animation: wa-pulse 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
  }

  .wa-button::after {
    animation-delay: 1.25s;
  }

  @keyframes wa-pulse {
    0% {
      opacity: 0.6;
      transform: scale(1);
    }
    100% {
      opacity: 0;
      transform: scale(1.8);
    }
  }

  /* Остановка пульсации при наведении */
  .wa-button:hover::before,
  .wa-button:hover::after {
    animation: none;
    opacity: 0;
  }

  /* === Бейдж "1" (непрочитанное) — опционально === */
  .wa-badge {
    position: absolute;
    top: -2px;
    right: -2px;
    width: 20px;
    height: 20px;
    background: #FF3B30;
    color: white;
    border-radius: 50%;
    font-size: 11px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid white;
    animation: wa-badgeBounce 1s ease infinite;
  }

  @keyframes wa-badgeBounce {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  /* === Адаптивность === */

  /* Мобильные (до 480px) — кнопка чуть меньше, ближе к краю */
  @media (max-width: 480px) {
    .wa-widget {
      --wa-size: 54px;
      --wa-bottom: 16px;
      --wa-right: 16px;
    }

    .wa-button svg {
      width: 28px;
      height: 28px;
    }

    .wa-tooltip {
      max-width: 180px;
      font-size: 12px;
      padding: 8px 12px;
    }
  }

  /* Очень маленькие экраны (до 360px) */
  @media (max-width: 360px) {
    .wa-widget {
      --wa-size: 48px;
      --wa-bottom: 12px;
      --wa-right: 12px;
    }
  }

  /* Уменьшение анимации для accessibility */
  @media (prefers-reduced-motion: reduce) {
    .wa-button::before,
    .wa-button::after {
      animation: none;
    }
    .wa-badge {
      animation: none;
    }
    .wa-tooltip {
      transition: none;
    }
  }
</style>

<!-- ============================================================
     HTML: Виджет WhatsApp
     ============================================================ -->
<div class="wa-widget" id="waWidget">

  <!-- Тултип (текст над кнопкой) -->
  <div class="wa-tooltip" id="waTooltip">
    <!-- Русский текст (по умолчанию) -->
    <span id="waTooltipText">Напишите нам в WhatsApp! Ответим за 5 минут</span>
  </div>

  <!-- Кнопка WhatsApp -->
  <a class="wa-button"
     id="waButton"
     href="https://wa.me/YOUR_WHATSAPP_NUMBER?text=%D0%97%D0%B4%D1%80%D0%B0%D0%B2%D1%81%D1%82%D0%B2%D1%83%D0%B9%D1%82%D0%B5!%20%D0%98%D0%BD%D1%82%D0%B5%D1%80%D0%B5%D1%81%D1%83%D1%8E%D1%82%20%D1%8D%D0%BA%D1%81%D0%BA%D1%83%D1%80%D1%81%D0%B8%D0%B8%20%D0%B2%20%D0%94%D1%83%D0%B1%D0%B0%D0%B5"
     target="_blank"
     rel="noopener noreferrer"
     aria-label="WhatsApp">

    <!-- WhatsApp SVG иконка -->
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
    </svg>

    <!-- Бейдж "1" — удалите если не нужен -->
    <span class="wa-badge">1</span>
  </a>
</div>

<!-- ============================================================
     JavaScript: Автоопределение языка + динамический текст
     ============================================================ -->
<script>
(function() {
  'use strict';

  // ============================================================
  // НАСТРОЙКИ — ЗАМЕНИТЕ НА СВОИ
  // ============================================================

  // Ваш номер WhatsApp (без +, только цифры)
  var WHATSAPP_NUMBER = 'YOUR_WHATSAPP_NUMBER'; // Например: 971501234567

  // Предзаполненные сообщения
  var MESSAGES = {
    ru: 'Здравствуйте! Интересуют экскурсии в Дубае',
    en: 'Hello! I am interested in Dubai tours and activities'
  };

  // Тексты тултипа
  var TOOLTIPS = {
    ru: 'Напишите нам в WhatsApp! Ответим за 5 минут',
    en: 'Message us on WhatsApp! We reply within 5 minutes'
  };

  // Через сколько секунд скрыть бейдж "1" (0 = не показывать)
  var BADGE_HIDE_AFTER = 10;

  // ============================================================
  // ЛОГИКА
  // ============================================================

  // Определяем язык пользователя
  var userLang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
  var isRussian = userLang.startsWith('ru') || userLang.startsWith('uk') || userLang.startsWith('kk');
  var lang = isRussian ? 'ru' : 'en';

  // Формируем URL с предзаполненным текстом
  var message = encodeURIComponent(MESSAGES[lang]);
  var waUrl = 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + message;

  // Устанавливаем URL кнопки
  var button = document.getElementById('waButton');
  if (button) {
    button.href = waUrl;
  }

  // Устанавливаем текст тултипа
  var tooltip = document.getElementById('waTooltipText');
  if (tooltip) {
    tooltip.textContent = TOOLTIPS[lang];
  }

  // Скрываем бейдж через N секунд
  if (BADGE_HIDE_AFTER > 0) {
    var badge = document.querySelector('.wa-badge');
    if (badge) {
      setTimeout(function() {
        badge.style.transition = 'opacity 0.3s ease';
        badge.style.opacity = '0';
        setTimeout(function() {
          badge.style.display = 'none';
        }, 300);
      }, BADGE_HIDE_AFTER * 1000);
    }
  }

})();
</script>
