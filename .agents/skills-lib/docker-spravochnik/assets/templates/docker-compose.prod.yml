# =============================================================================
# docker-compose.prod.yml -- Production-окружение
# Docker Engine 29.x | Compose v2.40+ | Февраль 2026
#
# Использование:
#   docker compose -f docker-compose.prod.yml up -d --wait
#
# Обязательно:
#   - Создай secrets/ папку с файлами паролей
#   - Настрой nginx/nginx.conf под свой домен
#   - Замени образ app на свой (или используй build: .)
# =============================================================================

services:
  # --- Nginx Reverse Proxy ---
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # - ./nginx/ssl:/etc/nginx/ssl:ro  # Раскомментируй для SSL
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - frontend
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --- Приложение ---
  app:
    image: ghcr.io/your-org/your-app:latest   # Замени на свой образ
    # build:
    #   context: .
    #   target: production
    env_file: .env
    secrets:
      - db_password
    environment:
      DB_PASSWORD_FILE: /run/secrets/db_password
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # --- PostgreSQL ---
  db:
    image: postgres:17-alpine
    # Порт НЕ пробрасываем наружу в production!
    secrets:
      - db_password
    environment:
      POSTGRES_DB: ${DB_NAME:-app}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --- Redis ---
  redis:
    image: redis:7-alpine
    command: >
      redis-server
        --appendonly yes
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# --- Volumes ---
volumes:
  db-data:                                # Данные PostgreSQL (named volume)
    name: ${COMPOSE_PROJECT_NAME:-app}_db-data
  redis-data:                             # Данные Redis (named volume)
    name: ${COMPOSE_PROJECT_NAME:-app}_redis-data

# --- Networks ---
networks:
  frontend:                               # Nginx <-> App (доступна извне)
    name: ${COMPOSE_PROJECT_NAME:-app}_frontend
  backend:                                # App <-> DB/Redis (изолированная)
    name: ${COMPOSE_PROJECT_NAME:-app}_backend
    internal: true                        # Нет доступа в интернет!

# --- Secrets ---
secrets:
  db_password:
    file: ./secrets/db_password.txt       # Создай файл с паролем
