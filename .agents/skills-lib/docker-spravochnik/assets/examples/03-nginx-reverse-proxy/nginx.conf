# =============================================================================
# nginx.conf — Reverse proxy для микросервисов туризма ОАЭ
# Nginx 1.27 | Docker Compose сеть | Февраль 2026
#
# Проксирует:
#   /api/         -> backend (Node.js/FastAPI бот бронирования)
#   /webhook/     -> whatsapp-bot (FastAPI webhook)
#   /             -> статика или SPA
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- Логирование ---
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    # --- Производительность ---
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # --- Сжатие ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # --- Upstream бэкенды (имена из docker-compose сервисов) ---
    upstream backend {
        server backend:3000;
    }

    upstream whatsapp_bot {
        server whatsapp-bot:8000;
    }

    # --- Ограничение частоты запросов ---
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=10r/s;

    server {
        listen 80;
        server_name _;

        # --- Security headers ---
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # --- Healthcheck (для Docker HEALTHCHECK) ---
        location /health {
            access_log off;
            return 200 '{"status":"ok","service":"nginx-proxy"}';
            add_header Content-Type application/json;
        }

        # --- API бронирования туров ---
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Таймауты
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # --- WhatsApp Webhook ---
        location /webhook {
            limit_req zone=webhook_limit burst=5 nodelay;

            proxy_pass http://whatsapp_bot;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
        }

        # --- Статика ---
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # --- Запрет доступа к скрытым файлам ---
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # =======================================================================
    # SSL-конфигурация (раскомментируй при наличии сертификата)
    # =======================================================================
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #
    #     # HSTS (раскомментируй после проверки SSL)
    #     # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #
    #     # Все location-блоки из server :80 скопировать сюда
    # }
    #
    # # Редирект HTTP -> HTTPS
    # server {
    #     listen 80;
    #     server_name your-domain.com;
    #     return 301 https://$host$request_uri;
    # }
}
