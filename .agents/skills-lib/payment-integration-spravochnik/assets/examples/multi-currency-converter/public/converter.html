<!DOCTYPE html><html><body><h1>Currency Converter</h1><input id="amt" type="number" value="100"><select id="to"><option>USD</option><option>RUB</option><option>KZT</option></select><button onclick="convert()">Convert</button><p id="result"></p><script>async function convert(){const r=await fetch("/api/convert",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({from:"AED",to:document.getElementById("to").value,amount:parseFloat(document.getElementById("amt").value)})});const d=await r.json();document.getElementById("result").textContent="Result: "+d.result;}</script></body></html>
