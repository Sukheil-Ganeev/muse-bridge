<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Tour Booking</title><script src="https://js.stripe.com/v3/"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:20px}.container{max-width:500px;margin:40px auto;background:#fff;border-radius:16px;padding:40px;box-shadow:0 20px 60px rgba(0,0,0,.3)}h1{color:#333;margin-bottom:10px}label{display:block;margin:8px 0;font-weight:500}input,select{width:100%;padding:12px;border:2px solid #e0e0e0;border-radius:8px;font-size:16px;margin-bottom:15px}button{width:100%;padding:14px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer}#card-element{padding:12px;border:2px solid #e0e0e0;border-radius:8px}.payment-summary{background:#f8f9fa;padding:20px;border-radius:8px;margin:20px 0}.summary-row{display:flex;justify-content:space-between;margin-bottom:10px}.success-message{background:#d4edda;padding:20px;border-radius:8px;margin-top:20px;display:none}</style></head><body><div class="container"><h1>Book Tour</h1><form id="form"><label>Name</label><input id="name" required><label>Email</label><input type="email" id="email" required><label>Phone</label><input id="phone" required><label>Tour</label><select id="tour" required><option value="">Choose...</option><option value="Desert Safari" data-price="350">Desert Safari - 350 AED</option><option value="Dubai Tour" data-price="250">Dubai Tour - 250 AED</option></select><div class="payment-summary" id="summary" style="display:none"><div class="summary-row"><span>Deposit (30%):</span><span id="deposit">0 AED</span></div><div class="summary-row"><span>Balance (70%):</span><span id="balance">0 AED</span></div></div><label>Card</label><div id="card-element"></div><div id="card-errors"></div><button type="submit">Pay Deposit</button></form><div class="success-message" id="success"><h3>Success!</h3><p id="ref"></p></div></div><script>const stripe=Stripe('pk_test_YOUR_KEY');const elements=stripe.elements();const card=elements.create('card');card.mount('#card-element');card.on('change',e=>{document.getElementById('card-errors').textContent=e.error?e.error.message:''});const tour=document.getElementById('tour');tour.addEventListener('change',function(){const p=parseInt(this.options[this.selectedIndex].dataset.price||0);if(p>0){const d=Math.round(p*0.3);document.getElementById('deposit').textContent=d+' AED';document.getElementById('balance').textContent=(p-d)+' AED';document.getElementById('summary').style.display='block'}});document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const data={customerName:document.getElementById('name').value,email:document.getElementById('email').value,phone:document.getElementById('phone').value,tourName:tour.options[tour.selectedIndex].value,totalAmount:parseInt(tour.options[tour.selectedIndex].dataset.price)};try{const r=await fetch('/api/create-booking',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const d=await r.json();if(!r.ok)throw new Error(d.error);const{error}=await stripe.confirmCardPayment(d.clientSecret,{payment_method:{card,billing_details:{name:data.customerName,email:data.email}}});if(error)throw new Error(error.message);document.getElementById('form').style.display='none';document.getElementById('ref').textContent='Booking: '+d.bookingReference;document.getElementById('success').style.display='block'}catch(err){alert('Error: '+err.message)}});</script></body></html>
