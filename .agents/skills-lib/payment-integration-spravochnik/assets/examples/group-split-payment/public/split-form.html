<!DOCTYPE html><html><body><h1>Group Split Payment</h1><form id="f"><input id="name" placeholder="Group Name"><input id="total" type="number" placeholder="Total Amount"><div id="participants"><input class="p-name" placeholder="Person 1 Name"><input class="p-email" placeholder="Person 1 Email"></div><button type="button" onclick="addPerson()">+ Add Person</button><button type="submit">Create</button></form><script>function addPerson(){const d=document.createElement("div");d.innerHTML="<input class="p-name" placeholder="Name"><input class="p-email" placeholder="Email">";document.getElementById("participants").appendChild(d);}document.getElementById("f").onsubmit=async e=>{e.preventDefault();const participants=Array.from(document.querySelectorAll(".p-name")).map((n,i)=>({name:n.value,email:document.querySelectorAll(".p-email")[i].value}));const r=await fetch("/api/create-group-payment",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({groupName:document.getElementById("name").value,totalAmount:parseFloat(document.getElementById("total").value),participants})});const d=await r.json();alert("Each pays: "+d.amountPerPerson);};</script></body></html>
