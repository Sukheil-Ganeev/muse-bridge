<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Form - UAE Tourism</title>
  <script src="https://js.stripe.com/v3/"></script>
  <style>
    /* Mobile-responsive payment form */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
    }

    .payment-form {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
      padding: 40px;
    }

    .logo {
      text-align: center;
      font-size: 32px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 8px;
      color: #1a1a1a;
      text-align: center;
    }

    .price {
      text-align: center;
      margin-bottom: 30px;
      color: #666;
      font-size: 16px;
    }

    .price strong {
      font-size: 28px;
      color: #667eea;
      font-weight: 700;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
      font-size: 14px;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"] {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
      font-family: inherit;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
    }

    #card-element {
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      background: white;
      transition: border-color 0.3s;
    }

    #card-element.StripeElement--focus {
      border-color: #667eea;
    }

    .btn-pay {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 24px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-pay:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }

    .btn-pay:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error {
      color: #d32f2f;
      font-size: 14px;
      margin-top: 8px;
      min-height: 20px;
    }

    .success {
      background: #e8f5e9;
      color: #2e7d32;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      font-weight: 600;
    }

    .success-icon {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .security-note {
      text-align: center;
      margin-top: 20px;
      color: #999;
      font-size: 12px;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Mobile responsive */
    @media (max-width: 480px) {
      .payment-form {
        padding: 24px;
      }

      h1 {
        font-size: 20px;
      }

      .price strong {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="payment-form">
      <div class="logo">🏝️</div>
      <h1>Desert Safari Tour</h1>
      <div class="price">
        Total: <strong>250.00 AED</strong>
      </div>

      <form id="payment-form">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" required placeholder="John Doe" autocomplete="name">
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" required placeholder="john@example.com" autocomplete="email">
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" required placeholder="+971 50 123 4567" autocomplete="tel">
        </div>

        <div class="form-group">
          <label for="card-element">Card Details</label>
          <div id="card-element"></div>
          <div id="card-errors" class="error"></div>
        </div>

        <button type="submit" class="btn-pay" id="submit-btn">
          Pay 250.00 AED
        </button>
      </form>

      <div id="success-message" style="display: none;">
        <div class="success">
          <div class="success-icon">✅</div>
          <div>Payment Successful!</div>
          <div style="font-size: 14px; margin-top: 8px; font-weight: normal;">
            Check your email for confirmation.
          </div>
        </div>
      </div>

      <div class="security-note">
        🔒 Secure payment powered by Stripe | PCI DSS compliant
      </div>
    </div>
  </div>

  <script>
    // IMPORTANT: Replace with your actual Stripe publishable key
    const STRIPE_PUBLISHABLE_KEY = 'pk_test_YOUR_KEY_HERE';

    const stripe = Stripe(STRIPE_PUBLISHABLE_KEY);
    const elements = stripe.elements();

    // Create card element with custom styling
    const cardElement = elements.create('card', {
      style: {
        base: {
          fontSize: '16px',
          color: '#32325d',
          fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
          '::placeholder': {
            color: '#aab7c4',
          },
        },
        invalid: {
          color: '#d32f2f',
          iconColor: '#d32f2f',
        },
      },
      hidePostalCode: true,
    });

    cardElement.mount('#card-element');

    // Handle real-time validation errors
    cardElement.on('change', (event) => {
      const displayError = document.getElementById('card-errors');
      if (event.error) {
        displayError.textContent = event.error.message;
      } else {
        displayError.textContent = '';
      }
    });

    // Handle form submission
    const form = document.getElementById('payment-form');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      // Disable submit button and show loading state
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span>Processing...';

      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const phone = document.getElementById('phone').value;

      try {
        // Step 1: Create PaymentIntent on server
        const response = await fetch('/api/create-payment-intent', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            amount: 25000, // 250.00 AED in fils (smallest unit)
            currency: 'aed',
            email: email,
            metadata: {
              customer_name: name,
              customer_phone: phone,
              tour_name: 'Desert Safari Tour',
            },
          }),
        });

        if (!response.ok) {
          throw new Error('Failed to create payment intent');
        }

        const { clientSecret } = await response.json();

        // Step 2: Confirm payment with Stripe
        const { error, paymentIntent } = await stripe.confirmCardPayment(clientSecret, {
          payment_method: {
            card: cardElement,
            billing_details: {
              name: name,
              email: email,
              phone: phone,
            },
          },
        });

        if (error) {
          // Show error to customer
          document.getElementById('card-errors').textContent = error.message;
          submitBtn.disabled = false;
          submitBtn.innerHTML = 'Pay 250.00 AED';
        } else if (paymentIntent.status === 'succeeded') {
          // Payment successful!
          form.style.display = 'none';
          document.getElementById('success-message').style.display = 'block';
        }
      } catch (err) {
        document.getElementById('card-errors').textContent =
          'An unexpected error occurred. Please try again.';
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Pay 250.00 AED';
        console.error('Payment error:', err);
      }
    });
  </script>
</body>
</html>
