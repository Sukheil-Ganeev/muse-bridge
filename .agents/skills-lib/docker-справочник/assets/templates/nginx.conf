# =============================================================================
# nginx.conf -- Шаблон reverse proxy для Docker Compose
# Nginx 1.27 | Docker Engine 29.x | Февраль 2026
#
# Использование:
#   1. Замени upstream backend на имя своего сервиса из compose.yaml
#   2. Замени порт 3000 на порт своего приложения
#   3. При наличии SSL — раскомментируй секцию server :443
#   4. Скопируй в nginx/nginx.conf рядом с compose.yaml
#
# Compose пример:
#   nginx:
#     image: nginx:1.27-alpine
#     volumes:
#       - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
#     ports:
#       - "80:80"
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- Логирование ---
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # --- Производительность ---
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # --- Сжатие ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # --- Upstream (замени на имя сервиса из compose.yaml) ---
    upstream backend {
        server app:3000;    # имя_сервиса:порт
    }

    # --- Ограничение частоты запросов ---
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # =======================================================================
    # HTTP Server (порт 80)
    # =======================================================================
    server {
        listen 80;
        server_name _;

        # --- Security headers ---
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # --- Healthcheck (для Docker HEALTHCHECK) ---
        location /health {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # --- API (проксирование к backend) ---
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Таймауты
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # --- WebSocket (раскомментируй если нужен) ---
        # location /ws/ {
        #     proxy_pass http://backend;
        #     proxy_http_version 1.1;
        #     proxy_set_header Upgrade $http_upgrade;
        #     proxy_set_header Connection "upgrade";
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_read_timeout 86400s;
        # }

        # --- Статика ---
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # --- Запрет доступа к скрытым файлам ---
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # =======================================================================
    # HTTPS Server (раскомментируй при наличии сертификата)
    # =======================================================================
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #
    #     # HSTS
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #
    #     # Скопируй все location-блоки из server :80 сюда
    # }
    #
    # # Редирект HTTP -> HTTPS
    # server {
    #     listen 80;
    #     server_name your-domain.com;
    #     return 301 https://$host$request_uri;
    # }
}
