# =============================================================================
# docker-ci.yml -- GitHub Actions: сборка, тест, push Docker-образа
# Docker Engine 29.x | GitHub Actions | Февраль 2026
#
# Использование:
#   1. Скопируй в .github/workflows/docker-ci.yml своего репозитория
#   2. Замени ${{ github.repository }} если образ называется иначе
#   3. Добавь секреты в Settings -> Secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
#      (или используй GHCR -- не нужны секреты, работает через GITHUB_TOKEN)
#
# Функции:
#   - Сборка multi-platform (linux/amd64 + linux/arm64)
#   - Push в GHCR (ghcr.io) -- бесплатно для публичных репозиториев
#   - Кэширование слоёв через GitHub Actions cache
#   - Push только на main (PR только собирает, не пушит)
# =============================================================================

name: Docker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write   # Для push в GHCR

    steps:
      # --- 1. Checkout кода ---
      - name: Checkout
        uses: actions/checkout@v4

      # --- 2. Настройка Docker Buildx (для multi-platform) ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- 3. Настройка QEMU (для ARM-сборки на x86 runner) ---
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # --- 4. Авторизация в GHCR ---
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- 5. Метаданные образа (теги и лейблы) ---
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      # --- 6. Сборка и push ---
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- 7. Сканирование уязвимостей (Docker Scout) ---
      # Раскомментируй при наличии Docker Scout в CI
      # - name: Docker Scout scan
      #   if: github.event_name != 'pull_request'
