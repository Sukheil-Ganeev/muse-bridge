# =============================================================================
# nginx.conf — Reverse proxy для WhatsApp Bot webhook
# Nginx 1.27 | Февраль 2026
# =============================================================================

events {
    worker_connections 1024;
}

http {
    # --- Логирование ---
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # --- Gzip ---
    gzip on;
    gzip_types application/json text/plain;

    # --- Upstream ---
    upstream whatsapp_bot {
        server whatsapp-bot:8000;
    }

    server {
        listen 80;
        server_name _;

        # --- Health Check для nginx ---
        location /health {
            return 200 '{"status":"ok","service":"nginx"}';
            add_header Content-Type application/json;
        }

        # --- WhatsApp Webhook ---
        location /webhook {
            proxy_pass http://whatsapp_bot;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Security Headers ---
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
    }
}
