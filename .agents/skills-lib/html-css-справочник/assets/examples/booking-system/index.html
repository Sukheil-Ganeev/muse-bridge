<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tour Booking</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar"><h1>Book Your Tour</h1></nav>
    <div class="container">
        <div class="booking-container">
            <div class="booking-form">
                <h2>Booking Form</h2>
                <form id="bookingForm" onsubmit="submitBooking(event)">
                    <div class="form-group">
                        <label>Full Name *</label>
                        <input type="text" name="name" required>
                    </div>
                    <div class="form-group">
                        <label>Email *</label>
                        <input type="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label>Phone *</label>
                        <input type="tel" name="phone" required>
                    </div>
                    <div class="form-group">
                        <label>Select Tour *</label>
                        <select name="tour" required onchange="updateTourDetails()">
                            <option value="">-- Choose --</option>
                            <option value="morning">Morning Safari (350 AED)</option>
                            <option value="evening">Evening Safari (420 AED)</option>
                            <option value="night">Night Safari VIP (650 AED)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Tour Date *</label>
                        <input type="date" name="date" required>
                    </div>
                    <div class="form-group">
                        <label>Adults *</label>
                        <input type="number" name="adults" value="1" min="1" onchange="calculatePrice()">
                    </div>
                    <div class="form-group">
                        <label>Children</label>
                        <input type="number" name="children" value="0" min="0" onchange="calculatePrice()">
                    </div>
                    <button type="submit" class="btn-submit">Book Now</button>
                </form>
            </div>
            <div class="booking-summary">
                <h2>Summary</h2>
                <div id="summary" class="summary-content">Select a tour</div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
