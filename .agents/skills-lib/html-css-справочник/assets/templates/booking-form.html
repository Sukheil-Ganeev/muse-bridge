<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Form</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Segoe UI, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 2rem; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .booking-form { background: white; padding: 2rem; border-radius: 10px; max-width: 600px; width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        .booking-form h1 { text-align: center; margin-bottom: 2rem; color: #333; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; font-weight: 600; color: #333; margin-bottom: 0.5rem; }
        input, select, textarea { width: 100%; padding: 0.8rem; border: 1px solid #ddd; border-radius: 5px; font-size: 1rem; font-family: inherit; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #667eea; }
        .guest-box { background: #f9f9f9; padding: 1rem; border-radius: 5px; margin-bottom: 1rem; }
        .guest-info { display: flex; gap: 1rem; margin-bottom: 1rem; }
        .guest-info input { flex: 1; }
        .btn-add { background: #667eea; color: white; padding: 0.5rem 1rem; border: none; border-radius: 5px; cursor: pointer; }
        .btn-add:hover { background: #764ba2; }
        .submit-btn { width: 100%; padding: 1rem; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 5px; font-size: 1.1rem; cursor: pointer; margin-top: 1rem; }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        @media (max-width: 480px) { .form-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="booking-form">
        <h1>Book Your Tour</h1>
        <form id="bookingForm">
            <div class="form-group">
                <label for="tour">Select Tour</label>
                <select id="tour" required>
                    <option value="">Choose a tour</option>
                    <option value="desert">Desert Safari - AED 199</option>
                    <option value="city">City Tour - AED 249</option>
                    <option value="mountain">Mountain Adventure - AED 179</option>
                </select>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="date">Booking Date</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group">
                    <label for="time">Preferred Time</label>
                    <input type="time" id="time" required>
                </div>
            </div>
            
            <div class="form-group">
                <label>Guest Information</label>
                <div class="guest-box">
                    <div class="form-row">
                        <div class="form-group" style="margin-bottom: 0;">
                            <input type="text" id="guestName" placeholder="Full Name" required>
                        </div>
                        <div class="form-group" style="margin-bottom: 0;">
                            <input type="email" id="guestEmail" placeholder="Email" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group" style="margin-bottom: 0;">
                            <input type="tel" id="guestPhone" placeholder="Phone Number" required>
                        </div>
                        <div class="form-group" style="margin-bottom: 0;">
                            <input type="number" id="guestCount" placeholder="Number of Guests" min="1" max="10" value="1" required>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="form-group">
                <label for="specialReq">Special Requests</label>
                <textarea id="specialReq" placeholder="Any special requests or dietary requirements..."></textarea>
            </div>
            
            <div class="form-group">
                <label><input type="checkbox" id="terms" required> I agree to booking terms and conditions</label>
            </div>
            
            <button type="submit" class="submit-btn">Confirm Booking</button>
        </form>
    </div>
    <script>
        document.getElementById('bookingForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Booking confirmed! You will receive confirmation email shortly.');
            this.reset();
        });
        
        document.getElementById('date').min = new Date().toISOString().split('T')[0];
    </script>
</body>
</html>
