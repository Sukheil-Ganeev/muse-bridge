<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Gallery</title><style>* { margin: 0; padding: 0; box-sizing: border-box; } body { font-family: Segoe UI, sans-serif; background: #f5f5f5; padding: 2rem; } .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; max-width: 1200px; margin: 0 auto; } .gallery-item { position: relative; overflow: hidden; border-radius: 8px; height: 250px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: transform 0.3s; } .gallery-item:hover { transform: scale(1.05); } .gallery-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); opacity: 0; transition: opacity 0.3s; display: flex; align-items: center; justify-content: center; } .gallery-item:hover .gallery-overlay { opacity: 1; } .overlay-text { color: white; font-weight: 600; } .lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; } .lightbox.active { display: flex; align-items: center; justify-content: center; } .lightbox-close { position: absolute; top: 20px; right: 30px; color: white; font-size: 2rem; cursor: pointer; } @media (max-width: 480px) { .gallery-grid { grid-template-columns: repeat(2, 1fr); } }</style></head><body><h1 style="text-align: center; margin-bottom: 2rem;">Tour Gallery</h1><div class="gallery-grid" id="galleryGrid"><div class="gallery-item" onclick="openLightbox(0)"><div style="width: 100%; height: 100%; background: linear-gradient(135deg, #ff9a56 0%, #ff6b6b 100%); display: flex; align-items: center; justify-content: center; font-size: 3rem;">Desert</div><div class="gallery-overlay"><div class="overlay-text">Desert Safari</div></div></div><div class="gallery-item" onclick="openLightbox(1)"><div style="width: 100%; height: 100%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center; font-size: 3rem;">City</div><div class="gallery-overlay"><div class="overlay-text">Dubai City</div></div></div><div class="gallery-item" onclick="openLightbox(2)"><div style="width: 100%; height: 100%; background: linear-gradient(135deg, #8b5a3c 0%, #d4a574 100%); display: flex; align-items: center; justify-content: center; font-size: 3rem;">Mountain</div><div class="gallery-overlay"><div class="overlay-text">Mountains</div></div></div><div class="gallery-item" onclick="openLightbox(3)"><div style="width: 100%; height: 100%; background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); display: flex; align-items: center; justify-content: center; font-size: 3rem;">Yacht</div><div class="gallery-overlay"><div class="overlay-text">Yacht Cruise</div></div></div></div><div class="lightbox" id="lightbox"><span class="lightbox-close" onclick="closeLightbox()">X</span><div style="font-size: 2rem; color: white;">Gallery View</div></div><script>function openLightbox(i) { document.getElementById('lightbox').classList.add('active'); } function closeLightbox() { document.getElementById('lightbox').classList.remove('active'); }</script></body></html>
