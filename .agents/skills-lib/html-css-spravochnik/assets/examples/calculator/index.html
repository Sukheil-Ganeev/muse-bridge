<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <title>Price Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar"><h1>Tour Price Calculator</h1></nav>
    <div class="container">
        <div class="calculator">
            <h2>Calculate Your Tour Price</h2>
            <form onsubmit="calculate(event)">
                <div class="form-group">
                    <label>Select Tour:</label>
                    <select id="tourSelect" onchange="updateDetails()">
                        <option value="">-- Choose --</option>
                        <option value="350">Morning Safari - 350 AED</option>
                        <option value="420">Evening Safari - 420 AED</option>
                        <option value="650">Night Safari VIP - 650 AED</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Adults:</label>
                    <input type="number" id="adults" value="1" min="1" onchange="updateDetails()">
                </div>
                <div class="form-group">
                    <label>Children:</label>
                    <input type="number" id="children" value="0" min="0" onchange="updateDetails()">
                </div>
                <button type="button" onclick="calculate()">Calculate</button>
            </form>
            <div id="result" class="result"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
